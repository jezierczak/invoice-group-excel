[tool.poetry]
name = "invoice_group_excel"
version = "0.1.4"
description = "Tool that groups excell rows with specified conditions"
authors = ["Jarosław Jezierczak <jezierczak@gmail.com>"]
license = "Free"
readme = "PYPI_README.md"

[tool.poetry.dependencies]
python = "^3.12"
openpyxl = "^3.1.5"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
mypy = "^1.18.2"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
